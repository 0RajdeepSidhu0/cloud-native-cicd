name: My First Ci pipline

on:
  push:
    branches: 
      - main
env:
  APP_NAME: cloud-native-cicd
  APP_VERSION: v1.0

jobs:
  test:
    env:
      ENVIRONMENT: testing
    runs-on: ubuntu-latest
    steps:
      - name: Display Github Information
        run:  |
          echo "Display Configuration"
          echo "Triggered by; ${{github.actor}}"
          echo "Repository: ${{github.repository}}"
          echo "Environment: ${{github.ref_name}}"