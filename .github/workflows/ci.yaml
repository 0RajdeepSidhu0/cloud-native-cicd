name: Ci pipline

on:
  push:
    branches: 
      - main
env:
  APP_NAME: cloud-native-cicd
  APP_VERSION: v1.0

jobs:
  test:
    env:
      ENVIRONMENT: testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: List Repository Files
        run: |
          pwd
          ls -la
      - name: Verifying if project Structure exists
        run:  |
          if [ -f index.html ] && [ -d css ] && [ -d js ]; then
            echo "Project structure verified successfully!"
          else
            echo "Project structure verification failed!"
            exit 1
          fi
