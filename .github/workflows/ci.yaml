name: Ci pipline

on:
  push:
    branches: 
      - main
env:
  APP_NAME: cloud-native-cicd
  APP_VERSION: v1.0

jobs:
  build:
    name: Building Application
    runs-on: ubuntu-latest

    steps:
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with: 
          # supplies config to that action
          name: application-build
          path: app.zip                 
          
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-build
          path: ./artifact
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Docker Image
        run: |
          docker build -t cloud-native-app:v1 .

  test:
    needs: build
    env:
      ENVIRONMENT: testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: List Repository Files
        run: |
          pwd
          ls -la
      - name: Verifying if project Structure exists
        run:  |
          if [ -f index.html ] && [ -d css ] && [ -d js ]; then
            echo "Project structure verified successfully!"
          else
            echo "Project structure verification failed!"
            exit 1
          fi
